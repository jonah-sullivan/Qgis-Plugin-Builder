[mypy]
python_version = 3.10
files = pluginbuilder4
# Skip files copied into generated plugins; the template classes are checked
exclude = ^pluginbuilder4/(help|plugin_templates/(shared|[^/]+/template))/
check_untyped_defs = False
warn_return_any = True
warn_unused_ignores = True
warn_unused_configs = True
warn_redundant_casts = True

# qgis-stubs covers qgis.core/gui/etc. but not the qgis.PyQt shim
[mypy-qgis.PyQt.*]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True

# pyuic6-generated, hand-patched; not type-checked
[mypy-pluginbuilder4.plugin_builder_dialog_base]
ignore_errors = True

# Core model fully annotated
[mypy-pluginbuilder4.plugin_specification,pluginbuilder4.plugin_builder]
disallow_untyped_defs = True
check_untyped_defs = True
