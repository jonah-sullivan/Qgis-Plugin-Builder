[mypy]
python_version = 3.10
files = pluginbuilder4
# Skip files copied into generated plugins; the template classes are checked
exclude = ^pluginbuilder4/(help|plugin_templates/(shared|[^/]+/template))/
strict = True

# The dialogs subclass the form class uic.loadUiType() builds at runtime (Any)
[mypy-pluginbuilder4.plugin_builder_dialog,pluginbuilder4.select_tags_dialog,pluginbuilder4.result_dialog]
disallow_subclassing_any = False
