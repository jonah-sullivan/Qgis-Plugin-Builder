[mypy]
python_version = 3.10
files = pluginbuilder4
exclude = ^pluginbuilder4/(plugin_templates|help)/
check_untyped_defs = False
warn_return_any = True
warn_unused_ignores = True
warn_unused_configs = True
warn_redundant_casts = True

# qgis-stubs covers qgis.core/gui/etc. but not the qgis.PyQt shim
[mypy-qgis.PyQt.*]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True

# pyuic6-generated, hand-patched; not type-checked
[mypy-pluginbuilder4.plugin_builder_dialog_base]
ignore_errors = True
