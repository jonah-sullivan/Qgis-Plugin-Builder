name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to QGIS plugin repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install sphinx qgis-plugin-ci

      - name: Build Sphinx docs
        run: make html
        working-directory: help

      - name: Create GitHub Release
        run: |
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 || \
          gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        run: |
          qgis-plugin-ci release ${{ github.ref_name }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --qgis-token ${{ secrets.QGIS_PLUGIN_TOKEN }} \
            --allow-uncommitted-changes
