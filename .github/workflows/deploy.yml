name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Deploy to QGIS plugin repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install sphinx defusedxml

      - name: Build Sphinx docs
        run: make html
        working-directory: help

      - name: Build plugin zip
        run: |
          zip -r pluginbuilder4.zip pluginbuilder4 \
            --exclude "*/doctrees/*" \
            --exclude "*/.buildinfo" \
            --exclude "*/.buildinfo.bak"

      - name: Upload to QGIS plugin repository
        env:
          PLUGIN_UPLOAD_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
          PLUGIN_UPLOAD_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          PLUGIN_UPLOAD_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: python pluginbuilder4/plugin_templates/shared/plugin_upload.py pluginbuilder4.zip
